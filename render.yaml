services:
  - type: web
    name: book-regional-linker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DATABASE_PATH
        value: /opt/render/project/src/links.db
    disk:
      name: data
      mountPath: /opt/render/project/src
      sizeGB: 1

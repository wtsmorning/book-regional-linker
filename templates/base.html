<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}BookLinker{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-text {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .glass {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
    }
    input:focus, textarea:focus {
      outline: none;
      box-shadow: 0 0 0 2px #f59e0b55;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Nav -->
  <nav class="border-b border-slate-800/60 px-6 py-4">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 text-xl font-bold">
        <span>📚</span>
        <span class="gradient-text">BookLinker</span>
      </a>
      <span class="text-slate-500 text-sm hidden sm:block">Smart regional book links</span>
    </div>
  </nav>

  <!-- Main -->
  <main class="max-w-3xl mx-auto px-4 py-12">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/60 mt-16 py-6 text-center text-slate-600 text-sm">
    BookLinker — open source regional book redirect tool
  </footer>

</body>
</html>
